<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago fallido — Human Sport</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#080808;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#181818;border:1px solid #252525;border-radius:16px;padding:48px 40px;max-width:440px;width:100%;text-align:center}
    .icon{font-size:4rem;margin-bottom:20px}
    h1{font-family:'Montserrat',sans-serif;font-size:1.6rem;font-weight:900;margin-bottom:12px}
    p{color:#888;line-height:1.7;margin-bottom:8px;font-size:0.95rem}
    .btns{display:flex;flex-direction:column;gap:12px;margin-top:28px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;background:#d4812a;color:#fff;border-radius:8px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.82rem;letter-spacing:1px;text-transform:uppercase;text-decoration:none;transition:.3s ease}
    .btn:hover{background:#b86a1f;transform:translateY(-2px)}
    .btn-wa{background:#25D366}.btn-wa:hover{background:#1da851}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">😕</div>
    <h1>Pago no procesado</h1>
    <p>Hubo un problema con tu pago. Podés intentarlo de nuevo o consultarnos por WhatsApp.</p>
    <div class="btns">
      <a href="/" class="btn">← Volver e intentar de nuevo</a>
      <a href="https://wa.me/5492346581240?text=Hola!%20Tuve%20un%20problema%20con%20el%20pago" target="_blank" class="btn btn-wa">💬 Contactar por WhatsApp</a>
    </div>
  </div>
</body>
</html>
